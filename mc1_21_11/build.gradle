plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }

base.archivesName = 'honeycrisp-1.21.11'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {
	minecraft "com.mojang:minecraft:1.21.11"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation project(':core')
}

// core classes + resources (natives/) ship inside this jar.
evaluationDependsOn(':core')
jar { from(project(':core').sourceSets.main.output) }

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}
