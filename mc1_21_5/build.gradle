plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }

base.archivesName = 'honeycrisp-1.21.5'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {
	minecraft "com.mojang:minecraft:1.21.5"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation project(':core')
}

// Shared sources: mc1_21_common (all 1.21.5–1.21.10) and mc1_21_5_8 (raw GLFW input args). 1.21.5's immediate-mode
// GuiGraphics (PoseStack, RenderType batches) gets its own renderer + HUD mixin in src/.
loom { accessWidenerPath = file('src/main/resources/honeycrisp.accesswidener') }
sourceSets.main {
	for (String dir : ['../mc1_21_common', '../mc1_21_5_8']) {
		java.srcDir "${dir}/src/main/java"
		resources.srcDir "${dir}/src/main/resources"
	}
}

// core classes + resources (natives/) ship inside this jar.
evaluationDependsOn(':core')
jar { from(project(':core').sourceSets.main.output) }

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}
