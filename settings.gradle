pluginManagement {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		maven { url = 'https://repo.essential.gg/repository/maven-public' }
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.minecraftforge.net/' }
		gradlePluginPortal()
	}
}
rootProject.name = 'honeycrisp'
// core: version-independent features, UI, design system, macOS natives (Java 8 bytecode: runs on every version).
// Version adapters are added as they land (mc26_3, mc1_8_9, ...), same layout as Graft.
include 'core', 'mc1_8_9', 'mc26_3', 'mc1_21_5', 'mc1_21_6', 'mc1_21_7', 'mc1_21_8', 'mc1_21_9', 'mc1_21_10', 'mc26_2', 'mc1_21_11', 'mc1_12_2', 'mc1_7_10'
